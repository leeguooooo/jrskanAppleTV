name: JRKANApple

options:
  bundleIdPrefix: com.leeguoo
  deploymentTarget:
    tvOS: "17.0"
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    # TestFlight 每次上传必须递增；Scripts/testflight.sh 用时间戳覆盖它。
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # 付费开发者团队（LI GUO，App Store Connect API 密钥所属团队）。
    DEVELOPMENT_TEAM: 6ZPXG4KVVS

# App/Sources/Shared 是纯业务层（网络 / 解析 / 模型 / 偏好 / 播放状态）加与平台无关的
# 设计元件，tvOS 与 iOS 共用；TV 和 iOS 目录只放各自的界面层。
# 两个目标共用一个 Bundle ID：App Store Connect 里同一条 App 记录挂 tvOS / iOS 两个平台。
targets:
  JRKANTV:
    type: application
    platform: tvOS
    sources:
      - path: App/Sources/Shared
      - path: App/Sources/TV
      - path: App/Resources/Assets.xcassets
      - path: App/Resources/LaunchScreen.storyboard
      - path: App/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: App/Info-TV.plist
      properties:
        CFBundleDisplayName: JRKAN
        CFBundleName: JRKAN
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchStoryboardName: LaunchScreen
        # 只用 HTTPS/HTTP 标准传输，属出口合规豁免；省掉每次上传的问卷。
        ITSAppUsesNonExemptEncryption: false
        # 第三方线路页面与 HLS 地址仍有 HTTP。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeguoo.jrskan.tv
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image

  # iPhone / iPad / Mac 一个 target。Mac 走 Mac Catalyst——它就是「iPad 应用跑在
  # Mac 上」，界面层与 iPad 完全共用，只有方向锁定和窗口尺寸按平台分叉。
  # Bundle ID 与 tvOS 相同，App Store Connect 里同一条记录挂 tvOS / iOS / macOS。
  JRKANiOS:
    type: application
    platform: iOS
    sources:
      - path: App/Sources/Shared
      - path: App/Sources/iOS
      - path: App/Resources/iOSAssets.xcassets
      - path: App/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: App/Info-iOS.plist
      properties:
        CFBundleDisplayName: JRKAN
        CFBundleName: JRKAN
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # Mac App Store 强制要求类目，缺这一项导出时直接被服务端拒收。
        LSApplicationCategoryType: public.app-category.sports
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: BrandMark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        # 画中画 / 锁屏继续出声都需要
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeguoo.jrskan.tv
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: YES
        # Catalyst 默认会派生出 maccatalyst. 前缀的 Bundle ID，那样在 ASC 里会
        # 变成另一个应用；关掉它，三端共用一条记录、一次通用购买。
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # 沙盒 entitlement 只能给 macOS：iOS 本来就在沙盒里，带上这个键会与
        # iOS 描述文件对不上而签名失败。
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/JRKANMac.entitlements

  JRKANTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: App/Tests
    dependencies:
      - target: JRKANTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeguoo.jrskan.tv.tests
        CODE_SIGNING_ALLOWED: NO

  JRKANiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Tests
    dependencies:
      - target: JRKANiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeguoo.jrskan.tv.iostests
        CODE_SIGNING_ALLOWED: NO

schemes:
  JRKANTV:
    build:
      targets:
        JRKANTV: all
        JRKANTVTests: [test]
    test:
      targets:
        - JRKANTVTests

  JRKANiOS:
    build:
      targets:
        JRKANiOS: all
        JRKANiOSTests: [test]
    test:
      targets:
        - JRKANiOSTests

  JRKANLiveContract:
    build:
      targets:
        JRKANTV: all
        JRKANTVTests: [test]
    test:
      targets:
        - JRKANTVTests
      environmentVariables:
        RUN_LIVE_JRS_TESTS: "1"
