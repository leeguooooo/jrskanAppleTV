name: JRKANApple

options:
  bundleIdPrefix: com.leeguoo
  deploymentTarget:
    tvOS: "17.0"
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    # TestFlight 每次上传必须递增；Scripts/testflight.sh 用时间戳覆盖它。
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # 付费开发者团队（LI GUO，App Store Connect API 密钥所属团队）。
    DEVELOPMENT_TEAM: 6ZPXG4KVVS

targets:
  JRKANTV:
    type: application
    platform: tvOS
    sources:
      - path: App/Sources
      - path: App/Resources/Assets.xcassets
      - path: App/Resources/LaunchScreen.storyboard
      - path: App/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: App/Info-TV.plist
      properties:
        CFBundleDisplayName: JRKAN
        CFBundleName: JRKAN
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchStoryboardName: LaunchScreen
        # 只用 HTTPS/HTTP 标准传输，属出口合规豁免；省掉每次上传的问卷。
        ITSAppUsesNonExemptEncryption: false
        # 第三方线路页面与 HLS 地址仍有 HTTP，正式提审前收紧到 NSExceptionDomains。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeguoo.jrskan.tv
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image

  JRKANTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: App/Tests
    dependencies:
      - target: JRKANTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeguoo.jrskan.tv.tests
        CODE_SIGNING_ALLOWED: NO

schemes:
  JRKANTV:
    build:
      targets:
        JRKANTV: all
        JRKANTVTests: [test]
    test:
      targets:
        - JRKANTVTests

  JRKANLiveContract:
    build:
      targets:
        JRKANTV: all
        JRKANTVTests: [test]
    test:
      targets:
        - JRKANTVTests
      environmentVariables:
        RUN_LIVE_JRS_TESTS: "1"
